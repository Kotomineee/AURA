name: Aplicativos AURA
on:
  push:
    branches: [main]
    paths: ['app/**', 'android/**', 'tools/**', 'launch_windows.py', 'requirements.txt', '.github/workflows/native-apps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: AURA-Android-0.4.0-dev
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller httpx
      - run: python tools/check_native.py
      - run: python -m PyInstaller --noconfirm --windowed --onedir --name AURA --collect-all uvicorn --collect-all fastapi --collect-all cryptography --hidden-import app.native_agent launch_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: AURA-Windows-0.4.0-dev
          path: dist/AURA/
          if-no-files-found: error
