name: Aplicativos AURA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: AURA-Android-0.1.6
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller httpx
      - run: python tools/check_native.py
      - run: python tools/check_icons.py
      - run: python tools/check_012.py
      - run: python tools/check_013.py
      - run: python tools/check_014.py
      - run: python tools/check_015.py
      - run: python tools/check_016.py
      - run: python tools/check_update_installer.py
      - run: python tools/build_windows.py
      - run: python tools/check_packaged_runtime.py dist/AURA-Windows-0.1.6.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AURA-Windows-0.1.6
          path: dist/AURA-Windows-0.1.6.exe
          if-no-files-found: error
  release_files:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p release
          cp artifacts/AURA-Windows-0.1.6/AURA-Windows-0.1.6.exe release/
          cp artifacts/AURA-Android-0.1.6/app-debug.apk release/AURA-Android-0.1.6.apk
          python tools/make_update_manifest.py --windows release/AURA-Windows-0.1.6.exe --android release/AURA-Android-0.1.6.apk --output release/aura-update.json
      - uses: actions/upload-artifact@v4
        with:
          name: AURA-Release-0.1.6
          path: release/
          if-no-files-found: error
